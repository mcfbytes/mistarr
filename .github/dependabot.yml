# Weekly, grouped update pull requests; each runs the full CI, including the armv7 cross build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    # TypeScript 7 and a newer Node typings line than the Node 24 CI runtime are not supported.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
