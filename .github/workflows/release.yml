name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: goto-bus-stop/setup-zig@v2
      - run: cargo install cargo-zigbuild
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
      - run: rustup target add armv7-unknown-linux-musleabihf
      - run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p mistarr-server
      - run: file target/armv7-unknown-linux-musleabihf/release/mistarr | grep -q "statically linked"
      - run: mkdir -p dist/stage
      - run: cp target/armv7-unknown-linux-musleabihf/release/mistarr dist/stage/mistarr
      - run: cp scripts/mistarr.sh dist/stage/mistarr.sh
      - run: tar -C dist/stage -czf mistarr-armv7.tar.gz mistarr mistarr.sh
      - name: Write release notes from the tag message only
        run: |
          git tag -l --format='%(contents:subject)' "${{ github.ref_name }}" > release-notes.txt
          echo >> release-notes.txt
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" >> release-notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: mistarr-armv7.tar.gz
          body_path: release-notes.txt
