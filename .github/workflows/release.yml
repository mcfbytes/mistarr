name: release
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      # Zig is the C cross-compiler and linker cargo-zigbuild drives for the bundled C code.
      - uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - run: cargo install --locked cargo-zigbuild@0.23.4
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
      - run: rustup target add armv7-unknown-linux-musleabihf
      - run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p mistarr-server
      - run: file target/armv7-unknown-linux-musleabihf/release/mistarr | grep -q "statically linked"
      - run: mkdir -p dist/stage
      - run: cp target/armv7-unknown-linux-musleabihf/release/mistarr dist/stage/mistarr
      - run: cp scripts/mistarr.sh dist/stage/mistarr.sh
      - run: cp scripts/install.sh dist/stage/install.sh
      - run: cp scripts/install.sh install.sh
      - run: tar -C dist/stage -czf mistarr-armv7.tar.gz mistarr mistarr.sh install.sh
      - run: sha256sum mistarr-armv7.tar.gz > mistarr-armv7.tar.gz.sha256
      - name: Check whether the pushed tag is annotated
        id: tagtype
        if: github.event_name == 'push'
        run: echo "type=$(git cat-file -t "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Read the release notes from the tag's annotation
        id: notes
        if: github.event_name == 'push' && steps.tagtype.outputs.type == 'tag'
        run: |
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          notes="$subject"
          if [ -n "$body" ]; then
            notes=$(printf '%s\n\n%s' "$notes" "$body")
          fi
          {
            echo "notes<<NOTES_EOF"
            printf '%s' "$notes"
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the release, setting the body from the tag's annotation
        if: github.event_name == 'push' && steps.tagtype.outputs.type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mistarr-armv7.tar.gz
            mistarr-armv7.tar.gz.sha256
            install.sh
          body: ${{ steps.notes.outputs.notes }}
      - name: Publish the release, leaving its body untouched
        if: github.event_name == 'release' || steps.tagtype.outputs.type != 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mistarr-armv7.tar.gz
            mistarr-armv7.tar.gz.sha256
            install.sh
