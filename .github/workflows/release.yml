name: release
on:
  release:
    types: [published]
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The binary reports the tag's version; see docs/DEPLOYMENT.md "Releasing".
      - name: Check the tag is vX.Y.Z semver and pass it to the build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s\n' "$TAG" | grep -Eq "$semver"; then
            echo "::error::release tag '$TAG' is not vMAJOR.MINOR.PATCH semver"
            exit 1
          fi
          echo "MISTARR_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "MISTARR_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      # Installs the pinned toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      # Zig is the C cross-compiler and linker cargo-zigbuild drives for the bundled C code.
      - uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - run: cargo install --locked cargo-zigbuild@0.23.4
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
      - run: rustup target add armv7-unknown-linux-musleabihf
      - run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p mistarr-server
      - run: file target/armv7-unknown-linux-musleabihf/release/mistarr | grep -q "statically linked"
      - run: mkdir -p dist/stage
      - run: cp target/armv7-unknown-linux-musleabihf/release/mistarr dist/stage/mistarr
      - run: cp scripts/mistarr.sh dist/stage/mistarr.sh
      - run: cp scripts/install.sh dist/stage/install.sh
      - run: cp scripts/install.sh install.sh
      - run: tar -C dist/stage -czf mistarr-armv7.tar.gz mistarr mistarr.sh install.sh
      - run: sha256sum mistarr-armv7.tar.gz > mistarr-armv7.tar.gz.sha256
      - name: Attach the assets to the published release, leaving its body untouched
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mistarr-armv7.tar.gz
            mistarr-armv7.tar.gz.sha256
            install.sh
