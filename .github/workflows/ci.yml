name: ci
# Branches are tested through their pull request; master is tested after each merge.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y transmission-daemon rtorrent
      # The package starts a system daemon; the suite runs its own on free ports.
      - run: sudo systemctl stop transmission-daemon || true
      # Ubuntu's AppArmor profile confines the daemon to /var/lib; the suite's config is under /tmp.
      - run: sudo apparmor_parser -R /etc/apparmor.d/transmission
      - name: make e2e
        shell: bash
        env:
          MISTARR_E2E_REQUIRE: transmission-daemon,rtorrent
        run: |
          mkdir -p target/e2e-logs
          make e2e 2>&1 | tee target/e2e-logs/cargo-test.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: target/e2e-logs
  principles:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/principles-gate.sh
  shell:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh scripts/mistarr.sh scripts/tests/run.sh
      - run: sh scripts/tests/run.sh
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run check
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm run size
      # Browsers are cached per lockfile; --with-deps still installs the system libraries.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
  cross:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      # Zig is the C cross-compiler and linker cargo-zigbuild drives for the bundled C code.
      - uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - run: cargo install --locked cargo-zigbuild@0.23.4
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
      - run: rustup target add armv7-unknown-linux-musleabihf
      - run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p mistarr-server
      - run: file target/armv7-unknown-linux-musleabihf/release/mistarr | grep -q "statically linked"
      - uses: actions/upload-artifact@v7
        with:
          name: mistarr-armv7
          path: target/armv7-unknown-linux-musleabihf/release/mistarr
