[workspace]
resolver = "2"
members = [
    "crates/mistarr-core",
    "crates/mistarr-mister",
    "crates/mistarr-sources",
    "crates/mistarr-clients",
    "crates/mistarr-server",
    "crates/mistarr-fixture",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mcfbytes/mistarr"
rust-version = "1.98"

# Shared dependency versions. Crates opt in with `dep.workspace = true`.
# Add here only after checking the dependency builds statically for
# armv7-unknown-linux-musleabihf (see CLAUDE.md).
[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
mistarr-core = { path = "crates/mistarr-core" }
mistarr-mister = { path = "crates/mistarr-mister" }
mistarr-sources = { path = "crates/mistarr-sources" }
mistarr-clients = { path = "crates/mistarr-clients" }
mistarr-fixture = { path = "crates/mistarr-fixture" }
async-trait = "0.1"
claxon = "0.4.3"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzma-rs = { version = "0.3", default-features = false, features = ["raw_decoder"] }
md-5 = "0.11"
proptest = { version = "1", default-features = false, features = ["std"] }
quick-xml = { version = "0.42", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rusqlite = "0.40"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
sha1 = "0.11"
tempfile = "3"
tokio = { version = "1", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# CHD track decoding and the hashes it feeds run at opt-level 3: measured 3x faster
# under qemu-arm for a few tens of KiB; see docs/CHD.md "Speed".
[profile.release.package.mistarr-core]
opt-level = 3

[profile.release.package.lzma-rs]
opt-level = 3

[profile.release.package.claxon]
opt-level = 3

[profile.release.package.ruzstd]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3

[profile.release.package.md-5]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

# Dependencies at opt-level 1 in dev and test builds keep the debug binary's resident
# pages inside the memory test's budget; see docs/TESTING.md "Memory budget".
[profile.dev.package."*"]
opt-level = 1
