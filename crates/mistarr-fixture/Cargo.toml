[package]
name = "mistarr-fixture"
description = "Development tool that builds synthetic DATs, torrents and test sets, and runs a local tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mistarr-fixture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
mistarr-core = { path = "../mistarr-core" }
mistarr-mister = { path = "../mistarr-mister" }
mistarr-sources = { path = "../mistarr-sources" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
sha1 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
