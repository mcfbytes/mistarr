[package]
name = "mistarr-fixture"
description = "Development tool that builds synthetic DATs, torrents and test sets, and runs a local tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mistarr-fixture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
mistarr-core.workspace = true
mistarr-mister.workspace = true
mistarr-sources.workspace = true
clap.workspace = true
sha1.workspace = true
zip.workspace = true
flate2.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
claxon.workspace = true
md-5.workspace = true
crc32fast.workspace = true
chd = { version = "0.3.4", default-features = false, features = ["std", "cd_full", "verify_block_crc"] }
