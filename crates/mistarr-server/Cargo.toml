[package]
name = "mistarr-server"
description = "The mistarr binary: HTTP server, database, jobs and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mistarr"
path = "src/main.rs"

[features]
# Catalog fixtures, the client fakes and the recording command sink, for integration tests.
test-support = ["mistarr-clients/test-support", "mistarr-mister/test-support"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
mistarr-core = { workspace = true, features = ["rusqlite"] }
mistarr-mister.workspace = true
mistarr-sources.workspace = true
mistarr-clients.workspace = true
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
clap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { workspace = true, features = ["bundled", "backup", "hooks"] }
rust-embed = "8"
rustix = { workspace = true, features = ["process"] }
serde_ignored = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "fs", "signal", "macros"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
zip.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[dev-dependencies]
mistarr-server = { path = ".", features = ["test-support"] }
mistarr-fixture.workspace = true
tempfile.workspace = true
proptest.workspace = true
rcgen.workspace = true
rustls.workspace = true
rusqlite = { workspace = true, features = ["bundled", "hooks", "trace"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
