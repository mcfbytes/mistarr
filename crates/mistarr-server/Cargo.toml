[package]
name = "mistarr-server"
description = "The mistarr binary: HTTP server, database, jobs and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mistarr"
path = "src/main.rs"

[features]
# Catalog fixtures and the client fakes, for integration tests.
test-support = ["mistarr-clients/test-support"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
mistarr-core = { path = "../mistarr-core" }
mistarr-mister = { path = "../mistarr-mister" }
mistarr-sources = { path = "../mistarr-sources" }
mistarr-clients = { path = "../mistarr-clients" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "fs", "signal", "macros"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[dev-dependencies]
mistarr-server = { path = ".", features = ["test-support"] }
mistarr-fixture = { path = "../mistarr-fixture" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
