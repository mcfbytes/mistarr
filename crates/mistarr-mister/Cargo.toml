[package]
name = "mistarr-mister"
description = "MiSTer platform table, core adapters and board integration for mistarr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
mistarr-core = { path = "../mistarr-core" }
quick-xml = { version = "0.42", default-features = false }
regex-lite = "0.1"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
