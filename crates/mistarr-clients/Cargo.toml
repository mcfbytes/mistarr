[package]
name = "mistarr-clients"
description = "Download client trait and Transmission / rtorrent implementations for mistarr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# In-process fake HTTP server for tests of this crate and its dependents.
test-support = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "io-util"] }

[dev-dependencies]
mistarr-clients = { path = ".", features = ["test-support"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "io-util", "macros"] }
