[package]
name = "mistarr-clients"
description = "Download client trait and Transmission / rtorrent implementations for mistarr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# In-process fake HTTP server for tests of this crate and its dependents.
test-support = []

[dependencies]
mistarr-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
quick-xml.workspace = true
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "io-util"] }

[dev-dependencies]
mistarr-clients = { path = ".", features = ["test-support"] }
proptest.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "io-util", "macros"] }
